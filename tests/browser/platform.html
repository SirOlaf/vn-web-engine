<!doctype html><meta charset="utf-8" /><title>Platform storage tests</title>
<h1>Platform storage tests</h1>
<button id="run">Run storage tests</button><button id="reload">Write reload fixture</button
><button id="check">Check reload fixture</button>
<pre id="result" role="status">Ready</pre>
<script type="module">
  import {IndexedDbStore} from '../../dist/platform/store.js';
  import {StoredFileSystem, readFile} from '../../dist/platform/filesystem.js';
  import {StoredRegistry, registryDword} from '../../dist/platform/registry.js';
  import {storageContract, equal, rejects} from '../platform-contract.mjs';
  const output = document.querySelector('#result');
  function bind(id, fn) {
    document.querySelector(id).onclick = async () => {
      output.textContent = 'Running';
      try {
        await fn();
        output.textContent = 'PASS';
      } catch (e) {
        output.textContent = e.stack || String(e);
      }
    };
  }
  function remove(ns) {
    return new Promise((resolve, reject) => {
      const r = indexedDB.deleteDatabase(`vn-runtime:${JSON.stringify(ns)}`);
      r.onsuccess = resolve;
      r.onerror = () => reject(r.error);
      r.onblocked = () => reject(new Error('cleanup blocked'));
    });
  }
  bind('#run', async () => {
    const ns = ['platform-contract', crypto.randomUUID()];
    const store = await IndexedDbStore.open(ns);
    let other;
    try {
      await storageContract(store);
      other = await IndexedDbStore.open(ns);
      await store.update((r) => {
        r.set('shared', Uint8Array.of(0));
      });
      await Promise.all(
        Array.from({length: 20}, (_, i) =>
          (i % 2 ? store : other).update((r) => {
            r.set('shared', Uint8Array.of(r.get('shared')[0] + 1));
          }),
        ),
      );
      equal(
        [...(await other.snapshot()).get('shared')],
        [20],
        'independent connections serialize updates',
      );
      await rejects(
        () =>
          store.update((r) => {
            r.set('shared', Uint8Array.of(99));
            throw new Error('abort browser transaction');
          }),
        /abort browser/,
      );
      equal([...(await other.snapshot()).get('shared')], [20]);
      let retainedRecords, retainedBytes;
      await store.update((records) => {
        retainedRecords = records;
        retainedBytes = Uint8Array.from({length: 513}, (_, index) => (index * 37) & 255);
        records.set('unaligned', retainedBytes.subarray(1));
        records.set('tail', retainedBytes);
        records.set('remove', Uint8Array.of(7));
      });
      retainedBytes.fill(99);
      retainedRecords.get('tail')[0] = 111;
      const before = await other.snapshot();
      equal(before.get('tail')[0], 0, 'callback-held views remain isolated');
      before.get('tail')[0] = 222;
      // Existing databases can contain views with a nonzero byte offset.
      const raw = await new Promise((resolve, reject) => {
        const request = indexedDB.open(`vn-runtime:${JSON.stringify(ns)}`);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      try {
        await new Promise((resolve, reject) => {
          const transaction = raw.transaction('records', 'readwrite');
          transaction.oncomplete = resolve;
          transaction.onabort = () => reject(transaction.error);
          transaction
            .objectStore('records')
            .put(
              Uint8Array.from({length: 513}, (_, index) => (index * 37) & 255).subarray(1),
              'unaligned',
            );
        });
      } finally {
        raw.close();
      }
      await store.update((records) => {
        // Keep one record unchanged while touching both a full word and the odd tail.
        records.get('tail')[4] ^= 255;
        records.get('tail')[512] ^= 255;
        records.delete('remove');
        records.set('empty', new Uint8Array());
      });
      const after = await other.snapshot();
      equal(after.get('tail')[0], 0, 'snapshot-held views remain isolated');
      equal(after.get('tail')[4], ((4 * 37) & 255) ^ 255);
      equal(after.get('tail')[512], ((512 * 37) & 255) ^ 255);
      equal(
        [...after.get('unaligned')],
        Array.from({length: 512}, (_, i) => ((i + 1) * 37) & 255),
      );
      equal(after.has('remove'), false);
      equal(after.get('empty').length, 0);
      await rejects(
        () =>
          store.update((records) => {
            records.get('tail')[0] = 123;
            return Promise.resolve();
          }),
        /synchronous/,
      );
      equal((await other.snapshot()).get('tail')[0], 0, 'invalid callback return aborts');
      store.close();
      await rejects(() => store.snapshot(), /closed/);
      const reopened = await IndexedDbStore.open(ns);
      try {
        equal([...(await reopened.snapshot()).get('shared')], [20]);
      } finally {
        reopened.close();
      }
      const isolatedNs = [...ns, 'other-profile'],
        isolated = await IndexedDbStore.open(isolatedNs);
      try {
        equal((await isolated.snapshot()).size, 0);
      } finally {
        isolated.close();
        await remove(isolatedNs);
      }
    } finally {
      store.close();
      other?.close();
      await remove(ns);
    }
  });
  const ns = ['platform-browser-reload', 'test-only'],
    key = {hive: 'HKCU', view: '32', path: 'Software\\Reload'};
  bind('#reload', async () => {
    const store = await IndexedDbStore.open(ns);
    try {
      await new StoredFileSystem(store).commit([
        {kind: 'write', path: '/save', data: Uint8Array.of(0, 255, 4)},
      ]);
      const reg = new StoredRegistry(store);
      await reg.createKey(key);
      await reg.setValue(key, 'setting', registryDword(23));
    } finally {
      store.close();
    }
  });
  bind('#check', async () => {
    const store = await IndexedDbStore.open(ns);
    try {
      equal([...(await readFile(new StoredFileSystem(store), '/save'))], [0, 255, 4]);
      equal([...(await new StoredRegistry(store).getValue(key, 'SETTING')).data], [23, 0, 0, 0]);
    } finally {
      store.close();
      await remove(ns);
    }
  });
</script>
