<!doctype html>
<meta charset="utf-8" />
<title>Synthetic raster DOM text checks</title>
<link rel="stylesheet" href="../../ui/player/player.css" />
<style>
  body {
    background: white;
    color: black;
  }
  #stage {
    position: relative;
    width: 320px;
    height: 180px;
  }
  #display {
    position: relative;
    width: 160px;
    height: 120px;
  }
  #viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100% !important;
  }
  canvas {
    width: 320px;
    height: 180px;
  }
</style>
<p id="result">Running synthetic text checks…</p>
<div id="display">
  <div id="viewport">
    <div id="stage"><canvas id="native" width="320" height="180"></canvas></div>
  </div>
</div>
<script type="module">
  import {BrowserRasterText} from '../../dist/text/browser-raster-text.js';
  import {BrowserRasterTextPresentation} from '../../dist/text/browser-raster-text-presentation.js';
  import {BrowserWindowDisplayHost} from '../../dist/platform/browser-window-display.js';
  import {recordRasterText} from '../../dist/text/raster-text.js';
  import {allocateBurikoBitmap, fillBurikoBitmap} from '../../dist/engines/buriko/native/bitmap.js';
  import {BurikoBitmapCompositor} from '../../dist/engines/buriko/native/bitmap-compositor.js';
  import {presentBurikoChildBitmap} from '../../dist/engines/buriko/native/child-bitmap.js';
  // All pixels and strings in this fixture are generated here. No game assets,
  // installation handles, or game storage are read.
  const canvas = document.querySelector('#native');
  const display = document.querySelector('#display');
  const stage = document.querySelector('#stage');
  const host = new BrowserWindowDisplayHost(display, document.querySelector('#viewport'), stage);
  // Exercise page expansion without requesting OS fullscreen or changing the saved preference.
  const fullscreenMode = localStorage.getItem('vn.fullscreen-mode');
  host.setMode('page');
  if (fullscreenMode === null) localStorage.removeItem('vn.fullscreen-mode');
  else localStorage.setItem('vn.fullscreen-mode', fullscreenMode);
  host.configure({width: 320, height: 180, fullscreen: false});
  const initialNative = canvas.getContext('2d').getImageData(0, 0, 1, 1).data.slice();
  const renderer = new BrowserRasterText(canvas);
  const frame = new ImageData(320, 180);
  for (let i = 3; i < frame.data.length; i += 4) frame.data[i] = 255;
  const glyph = (id, text, x, y, vertical = false) => ({
    id,
    text,
    x,
    y,
    width: 16,
    height: 24,
    clip: {x, y, width: 16, height: 24},
    size: 24,
    family: 'sans-serif',
    bold: false,
    vertical,
    color: 0xffffff,
    alpha: 255,
  });
  const check = (condition, message) => {
    if (!condition) throw Error(message);
  };
  const checkAlignment = (message) => {
    const native = canvas.getBoundingClientRect();
    for (const element of [renderer.text.element, renderer.text.element.querySelector('canvas')]) {
      const overlay = element.getBoundingClientRect();
      for (const axis of ['left', 'top', 'width', 'height'])
        check(Math.abs(overlay[axis] - native[axis]) < 0.1, `${message}: ${axis}`);
    }
  };
  try {
    renderer.show(frame, [glyph(1, 'A', 10, 10), glyph(2, 'B', 26, 10)]);
    check(canvas.getBoundingClientRect().width <= 160, 'window fits at half scale or smaller');
    checkAlignment('scaled window alignment');
    host.setFullscreen(true);
    checkAlignment('nonuniform page expansion without another frame');
    renderer.show(frame, [glyph(1, 'A', 10, 10), glyph(2, 'B', 26, 10)]);
    checkAlignment('nonuniform page expansion after another frame');
    canvas.style.margin = '7px 0 0 11px';
    stage.style.border = '3px solid transparent';
    renderer.show(frame, [glyph(1, 'A', 10, 10), glyph(2, 'B', 26, 10)]);
    checkAlignment('position within a scaled bordered window');
    canvas.style.margin = '';
    stage.style.border = '';
    host.setFullscreen(false);
    renderer.show(frame, [glyph(1, 'A', 10, 10), glyph(2, 'B', 26, 10)]);
    checkAlignment('return to windowed alignment');
    const node = renderer.text.element.querySelector('[data-game-text]').firstChild;
    check(node.nodeType === Node.TEXT_NODE && node.data === 'AB', 'continuous line');
    const range = document.createRange();
    range.setStart(node, 0);
    range.setEnd(node, 1);
    document.getSelection().removeAllRanges();
    document.getSelection().addRange(range);
    renderer.show(frame, [
      glyph(1, 'A', 10, 10),
      glyph(2, 'B', 26, 10),
      glyph(3, 'C', 42, 10),
      glyph(4, 'D', 10, 40),
    ]);
    check(
      renderer.text.element.querySelector('[data-game-text]').firstChild === node,
      'stable reveal node',
    );
    check(node.data === 'ABC\nD', 'authoritative native line wrap');
    check(document.getSelection().toString() === 'A', 'selection preserved while revealing');
    document.getSelection().removeAllRanges();
    const dialogue = [
      glyph(10, 'A', 10, 10),
      glyph(11, 'B', 26, 10),
      glyph(12, 'C', 42, 10),
      glyph(13, 'D', 26, 46),
      glyph(14, 'E', 42, 46),
      glyph(15, 'F', 26, 82),
      glyph(16, 'G', 42, 82),
    ].map((g, i) => ({...g, family: 'monospace', alpha: [255, 96, 192][i % 3]}));
    renderer.show(frame, dialogue);
    const paragraph = renderer.text.element.querySelector('[data-game-text]'),
      paragraphNode = paragraph.firstChild;
    check(
      renderer.text.element.querySelectorAll('[data-game-text]').length === 1,
      'fades or hanging indentation fragmented dialogue',
    );
    check(paragraphNode.data === 'ABC\nDE\nFG', 'native dialogue row boundaries lost');
    const characterRect = (index) => {
      const r = document.createRange();
      r.setStart(paragraphNode, index);
      r.setEnd(paragraphNode, index + 1);
      return r.getBoundingClientRect();
    };
    const firstRect = characterRect(0),
      secondRect = characterRect(4),
      thirdRect = characterRect(7),
      presentationScale = renderer.text.element.getBoundingClientRect().width / frame.width;
    check(
      Math.abs(secondRect.left - firstRect.left - 16 * presentationScale) < 1,
      'native dialogue continuation indentation lost',
    );
    check(
      Math.abs(secondRect.top - firstRect.top - 36 * presentationScale) < 1 &&
        Math.abs(thirdRect.top - secondRect.top - 36 * presentationScale) < 1,
      'dialogue wrapped on browser widths instead of native rows',
    );
    if (CSS.highlights && typeof Highlight !== 'undefined')
      check(
        [...CSS.highlights.keys()].some((name) => name.startsWith('game-ink-')),
        'native per-glyph fade alpha was dropped',
      );
    for (const g of dialogue) g.alpha = 255;
    renderer.show(frame, dialogue);
    check(paragraph.firstChild === paragraphNode, 'fades replaced the paragraph node');
    if (CSS.highlights)
      check(
        ![...CSS.highlights.keys()].some((name) => name.startsWith('game-ink-')),
        'retired fade ranges leaked',
      );
    range.selectNodeContents(paragraphNode);
    document.getSelection().addRange(range);
    const clipboard = new DataTransfer();
    document.dispatchEvent(
      new ClipboardEvent('copy', {clipboardData: clipboard, cancelable: true}),
    );
    check(clipboard.getData('text/plain') === 'ABCDEFG', 'copy included presentation-only wraps');
    document.getSelection().removeAllRanges();
    // A later row with different font advances cannot reflow completed text.
    // Strings, geometry, and pixels in this reveal are generated synthetic data.
    const completed = Array.from('iiii').map((c, i) => glyph(30 + i, c, 10 + i * 16, 10)),
      reveal = Array.from('WWWWW').map((c, i) => glyph(40 + i, c, 10 + i * 16, 46));
    let stableNode, stableStyle, stableEndpoint;
    for (let length = 1; length <= reveal.length; length++) {
      renderer.show(frame, [...completed, ...reveal.slice(0, length)]);
      const element = renderer.text.element.querySelector('[data-game-text]'),
        node = element.firstChild,
        endpoint = document.createRange();
      endpoint.setStart(node, 3);
      endpoint.setEnd(node, 4);
      const rect = endpoint.getBoundingClientRect(),
        style = [
          element.style.left,
          element.style.top,
          element.style.transform,
          element.style.lineHeight,
        ].join('/');
      check(
        node.data === `iiii\n${'W'.repeat(length)}`,
        'second-row reveal altered completed source',
      );
      if (stableNode) {
        check(
          node === stableNode && style === stableStyle,
          'later reveal changed paragraph identity or scaling',
        );
        check(
          Math.abs(rect.left - stableEndpoint.left) < 0.1 &&
            Math.abs(rect.top - stableEndpoint.top) < 0.1,
          'completed row endpoint moved during reveal',
        );
      }
      stableNode = node;
      stableStyle = style;
      stableEndpoint = rect;
    }
    const body = completed.map((g) => ({...g, text: 'W'})),
      marker = {...glyph(99, 'i', 74, 10), flow: 'synthetic-wait-indicator'};
    let markerBodyNode, markerBodyStyle, markerBodyEndpoint;
    for (let cycle = 0; cycle < 6; cycle++) {
      const visible = cycle & 1;
      renderer.show(frame, [...body, ...reveal, ...(visible ? [marker] : [])]);
      const element = renderer.text.element.querySelector('[data-game-text]'),
        node = element.firstChild,
        endpoint = document.createRange();
      endpoint.setStart(node, 3);
      endpoint.setEnd(node, 4);
      const rect = endpoint.getBoundingClientRect(),
        style = [element.style.font, element.style.transform, element.style.lineHeight].join('/');
      check(node.data === 'WWWW\nWWWWW', 'marker entered dialogue typography');
      check(
        renderer.text.element.querySelectorAll('[data-game-text]').length === 1 + visible,
        'marker flow was not independent',
      );
      if (markerBodyNode) {
        check(
          node === markerBodyNode && style === markerBodyStyle,
          'indicator changed completed text font or scaling',
        );
        check(
          Math.abs(rect.left - markerBodyEndpoint.left) < 0.1 &&
            Math.abs(rect.top - markerBodyEndpoint.top) < 0.1 &&
            Math.abs(rect.width - markerBodyEndpoint.width) < 0.1,
          'completed text pulsated with indicator visibility',
        );
      }
      markerBodyNode = node;
      markerBodyStyle = style;
      markerBodyEndpoint = rect;
    }
    renderer.show(frame, [glyph(5, '日', 250, 10, true), glyph(6, '本', 250, 34, true)]);
    const vertical = renderer.text.element.querySelector('[data-game-text]');
    check(
      vertical.textContent === '日本' && vertical.style.writingMode === 'vertical-rl',
      'vertical text',
    );
    renderer.hide();
    check(
      renderer.text.element.hidden && !renderer.text.element.querySelector('[data-game-text]'),
      'hide clears text',
    );
    renderer.dispose();
    check(!document.querySelector('.game-glyph-slots'), 'dispose removes layer');
    check(
      canvas
        .getContext('2d')
        .getImageData(0, 0, 1, 1)
        .data.every((v, i) => v === initialNative[i]),
      'native canvas unchanged',
    );
    const owner = new BrowserRasterTextPresentation();
    const surface = allocateBurikoBitmap(320, 180, 1),
      ink = allocateBurikoBitmap(12, 24, 1);
    fillBurikoBitmap(surface, 0);
    fillBurikoBitmap(ink, 0xffffff);
    recordRasterText(ink, 'Z', {size: 24, width: 12});
    new BurikoBitmapCompositor().draw(surface, 10, 10, ink, 0, 0);
    presentBurikoChildBitmap(canvas, surface, 0, 0, owner);
    check(!document.querySelector('.game-glyph-slots'), 'native mode has no alternate display');
    const canonical = canvas.getContext('2d').getImageData(10, 10, 1, 1).data.slice();
    surface.storage.release();
    ink.storage.release();
    owner.setTextMode('dom');
    check(
      document.querySelector('[data-game-text]').textContent === 'Z',
      'retained child frame survives native release',
    );
    owner.setTextMode('native');
    owner.setTextMode('dom');
    check(
      document.querySelector('[data-game-text]').textContent === 'Z',
      'live mode switching retains text',
    );
    check(
      canvas
        .getContext('2d')
        .getImageData(10, 10, 1, 1)
        .data.every((v, i) => v === canonical[i]),
      'mode switch does not change native pixels',
    );
    owner.clear(canvas);
    owner.dispose();
    check(!document.querySelector('.game-glyph-slots'), 'presentation teardown');
    document.querySelector('#result').textContent =
      'PASS: scaled window and page expansion alignment, continuous text, reveal selection, vertical text, native pixel isolation, bitmap output and mode-switch lifecycle';
    window.testResult = 'PASS';
  } catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.message;
    window.testResult = error.stack;
  } finally {
    host.dispose();
  }
</script>
