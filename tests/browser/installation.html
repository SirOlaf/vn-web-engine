<!doctype html>
<meta charset="utf-8" />
<title>Synthetic installation storage check</title>
<h1>Synthetic installation storage check</h1>
<p>This page reads generated bytes only. It never loads or displays game assets.</p>
<button id="write">Write and cancel replacement</button>
<button id="read">Check after reload and remove</button>
<pre id="result" role="status">Ready</pre>
<div id="controls"></div>
<script type="module">
  import {mount, flushSync} from 'svelte';
  import InstallationFiles from '../../ui/player/InstallationFiles.svelte';
  import {BlobSource} from '../../src/core/source.js';
  import {openWorkerSource} from '../../src/core/worker-source.js';
  import {BrowserInstallationCache} from '../../src/platform/installation-cache.js';
  import {mountInstallationControls} from '../../ui/player/installation-controls.ts';
  // Run with the Vite development server so this uses the production Svelte widget.
  flushSync(() => mount(InstallationFiles, {target: document.querySelector('#controls')}));
  const cache = new BrowserInstallationCache();
  const key = 'synthetic-browser-installation-check';
  const size = 9 * 1024 * 1024 + 3;
  const result = document.querySelector('#result');
  let busy = false;
  let selected = {
    files: [
      {path: '/generated.bin', source: new BlobSource(new Blob(['fixture'])), lastModifiedMs: 0},
    ],
    metadata: {},
    attachments: {},
  };
  mountInstallationControls({
    key: key + '-controls',
    choose: document.querySelector('#choose'),
    input: document.querySelector('#files'),
    current: () => selected,
    busy: () => busy,
    setBusy: (value) => {
      busy = value;
    },
    select: async () => {
      throw new Error('Use generated files for this fixture.');
    },
    load: async (installation) => {
      const source = installation.files[0].source;
      assert(
        new TextDecoder().decode(await source.read(0, source.size)) === 'fixture',
        'Control loaded different bytes',
      );
      selected = installation;
    },
    clear: () => {
      selected = null;
    },
    report: (message) => {
      result.textContent = message;
    },
  });
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function bind(id, action) {
    document.querySelector(id).onclick = async () => {
      result.textContent = 'Running';
      try {
        await action();
        result.textContent = 'PASS';
      } catch (error) {
        result.textContent = error.stack ?? String(error);
      }
    };
  }
  bind('#write', async () => {
    assert(cache.available(), 'OPFS writable storage unavailable');
    const bytes = new Uint8Array(size).fill(37);
    const installation = {
      files: [
        {path: '/synthetic.bin', source: new BlobSource(new Blob([bytes])), lastModifiedMs: 1234},
      ],
      metadata: {fixture: 'synthetic'},
      attachments: {note: new Blob(['generated'])},
    };
    await cache.save(key, installation);
    const controller = new AbortController();
    try {
      await cache.save(key, installation, {
        signal: controller.signal,
        progress: ({completedBytes}) => {
          if (completedBytes) controller.abort();
        },
      });
      throw new Error('Replacement unexpectedly completed');
    } catch (error) {
      assert(error.name === 'AbortError', String(error));
    }
    assert((await cache.open(key)).files[0].source.size === size, 'Previous installation lost');
  });
  bind('#read', async () => {
    const installation = await cache.open(key);
    assert(installation?.metadata.fixture === 'synthetic', 'Installation did not survive reload');
    const source = installation.files[0].source;
    const worker = openWorkerSource(structuredClone({kind: 'blob', blob: source.blob}));
    assert(
      (await worker.read(size - 3, 3)).every((byte) => byte === 37),
      'Worker byte ranges changed',
    );
    assert((await installation.attachments.note.text()) === 'generated', 'Attachment changed');
    await cache.remove(key);
    assert((await cache.open(key)) === null, 'Cache removal failed');
  });
</script>
