<!doctype html><meta charset="utf-8" /><title>Canvas draw-list checks</title>
<style>
  body {
    background: #171b24;
    color: white;
    font: 18px system-ui;
  }
  canvas {
    width: 320px;
    image-rendering: pixelated;
  }
</style>
<h1>Canvas draw-list checks</h1>
<p id="status">Running…</p>
<canvas></canvas>
<script type="module">
  import {GpuRenderSurface} from './graphics/gpu-render-surface.js';
  import {CanvasDrawTarget} from './graphics/draw-list.js';
  const status = document.querySelector('#status');
  try {
    const canvas = document.querySelector('canvas'),
      target = new CanvasDrawTarget(canvas, 4, 4),
      source = {width: 2, height: 1, pixels: new Uint8Array([255, 128, 64, 128, 0, 255, 0, 255])};
    const sprite = (changes = {}) => ({
      texture: 0,
      source: {x: 0, y: 0, width: 1, height: 1},
      destination: {x: 0, y: 0, width: 4, height: 4},
      color: 0xffffff,
      alpha: 255,
      filter: 'nearest',
      ...changes,
    });
    const pixel = () => [...canvas.getContext('2d').getImageData(1, 1, 1, 1).data];
    let checks = 0;
    const expect = (actual, wanted) => {
      if (actual.some((v, i) => Math.abs(v - wanted[i]) > 1)) throw Error(`${actual} != ${wanted}`);
      checks++;
    };
    target.draw({sprites: [sprite()]}, () => source);
    expect(pixel(), [128, 64, 32, 255]);
    target.draw({sprites: [sprite({color: 0x80ff00})]}, () => source);
    expect(pixel(), [64, 64, 0, 255]);
    target.draw({sprites: [sprite({alpha: 128})]}, () => source);
    expect(pixel(), [64, 32, 16, 255]);
    target.draw({sprites: [sprite({source: {x: 1, y: 0, width: 1, height: 1}})]}, () => source);
    expect(pixel(), [0, 255, 0, 255]);
    source.pixels.set([0, 0, 255, 255], 4);
    target.invalidate(source);
    target.draw({sprites: [sprite({source: {x: 1, y: 0, width: 1, height: 1}})]}, () => source);
    expect(pixel(), [0, 0, 255, 255]);
    target.draw({sprites: []}, () => source);
    expect(pixel(), [0, 0, 0, 255]);
    target.draw({sprites: [sprite({alpha: 0})]}, () => source);
    expect(pixel(), [0, 0, 0, 255]);
    // GPU surfaces persist across target switches and frames, without CPU copies.
    target.draw(
      {
        sprites: [],
        commands: [
          {kind: 'solid', destination: {x: 0, y: 0, width: 1, height: 1}, color: 0, alpha: 0},
        ],
      },
      () => source,
    );
    const gl = target.gl,
      calls = {reads: 0, uploads: 0, frames: 0, deleteFrames: 0, deleteTextures: 0};
    for (const [method, counter] of Object.entries({
      readPixels: 'reads',
      texImage2D: 'uploads',
      createFramebuffer: 'frames',
      deleteFramebuffer: 'deleteFrames',
      deleteTexture: 'deleteTextures',
    })) {
      const original = gl[method].bind(gl);
      gl[method] = (...args) => {
        calls[counter]++;
        return original(...args);
      };
    }
    const a = new GpuRenderSurface(2, 2),
      b = new GpuRenderSurface(2, 2);
    target.prepareRenderSurface(a);
    target.prepareRenderSurface(a);
    target.prepareImage(b);

    // Use strict counters, unlike the pixel comparison's one-unit tolerance.
    const exact = (actual, wanted) => {
      if (JSON.stringify(actual) !== JSON.stringify(wanted))
        throw Error(`${JSON.stringify(actual)} != ${JSON.stringify(wanted)}`);
      checks++;
    };
    exact([calls.uploads, calls.frames], [2, 2]);
    const lookup = (id) => [a, b, source][id];
    const bind = (surface, clearColor) => ({kind: 'gpu-target', surface, clearColor});
    const solid = (color, y, alpha = 255) => ({
      kind: 'solid',
      destination: {x: 0, y, width: 2, height: 1},
      color,
      alpha,
    });
    const copy = (texture = 0, changes = {}) =>
      sprite({texture, source: {x: 0, y: 0, width: 2, height: 2}, ...changes});
    const xy = (x, y) => [...canvas.getContext('2d').getImageData(x, y, 1, 1).data];
    const draw = (commands) => target.draw({sprites: [], commands}, lookup);
    draw([
      bind(a, [0, 0, 0, 0]),
      solid(0xff0000, 0),
      solid(0x0000ff, 1),
      bind(b, [0, 0, 0, 0]),
      copy(0, {destination: {x: 0, y: 0, width: 2, height: 2}}),
      bind(null),
      copy(1),
    ]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 255, 255]);
    exact([calls.reads, calls.uploads, calls.frames], [0, 2, 2]);
    draw([]);
    draw([copy(1)]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 255, 255]);
    exact([calls.reads, calls.uploads, calls.frames], [0, 2, 2]);
    // A background snapshot preserves bytes, row orientation and the active target.
    const fails = (run, message) => {
      let caught = false;
      try {
        run();
      } catch (error) {
        if (!error.message.includes(message)) throw error;
        caught = true;
      }
      exact(caught, true);
    };
    const snapshot = {kind: 'gpu-copy', source: a, destination: b};
    draw([bind(a), snapshot, solid(0x00ff00, 1), bind(null), copy(1)]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 255, 255]);
    draw([copy(0)]);
    expect(xy(1, 3), [0, 255, 0, 255]);
    exact([calls.reads, calls.uploads, calls.frames], [0, 2, 2]);
    fails(() => draw([{...snapshot, destination: a}]), 'cannot copy itself');
    fails(() => draw([{...snapshot, destination: new GpuRenderSurface(2, 2)}]), 'not prepared');
    draw([bind(a), solid(0x0000ff, 1), bind(null)]);
    // Mask and additional texture coordinates also follow top-down image coordinates.
    draw([
      bind(a, [0, 0, 0, 0]),
      solid(0x00ff00, 0),
      solid(0x000000, 1),
      bind(null),
      copy(1, {
        mask: {
          texture: 0,
          source: {x: 0, y: 0, width: 2, height: 2},
          channel: 'red',
          invert: true,
          scale: 1,
          bias: 0,
          filter: 'nearest',
        },
      }),
    ]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 255, 255]);
    // Red mask: top visible, bottom invisible.
    draw([
      bind(a, [0, 0, 0, 0]),
      solid(0xff0000, 0),
      solid(0, 1),
      bind(null),
      copy(1, {
        mask: {
          texture: 0,
          source: {x: 0, y: 0, width: 2, height: 2},
          channel: 'red',
          scale: 1,
          bias: 0,
          filter: 'nearest',
        },
      }),
    ]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 0, 255]);
    const coords = [
        [0, 0],
        [1, 0],
        [0, 1],
        [0, 1],
        [1, 0],
        [1, 1],
      ],
      vertices = new Float32Array(coords.flatMap(([x, y]) => [x * 4, y * 4, 0, 1, 1, 1, 1, x, y]));
    draw([
      {
        kind: 'triangles',
        texture: 0,
        normalizedUV: true,
        vertices,
        filter: 'nearest',
        fragment: 'vec4 shade(vec4 s,vec4 t){return texture(additionalAtlas0,additionalUV0);}',
        additionalTextures: [{texture: 1, uv: new Float32Array(coords.flat()), filter: 'nearest'}],
      },
    ]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    expect(xy(1, 3), [0, 0, 255, 255]);
    fails(
      () =>
        draw([
          bind(a),
          copy(1, {
            mask: {
              texture: 0,
              source: {x: 0, y: 0, width: 2, height: 2},
              channel: 'alpha',
              scale: 1,
              bias: 0,
            },
          }),
        ]),
      'Cannot sample',
    );
    fails(
      () =>
        draw([
          bind(a),
          {
            kind: 'triangles',
            texture: 1,
            vertices,
            normalizedUV: true,
            additionalTextures: [{texture: 0, uv: new Float32Array(coords.flat())}],
          },
        ]),
      'Cannot sample',
    );
    fails(() => draw([bind(a), copy(0)]), 'Cannot sample');
    fails(() => draw([bind(a)]), 'must return');
    fails(() => draw([bind(a, [NaN, 0, 0, 0])]), 'clear color');
    // An aborted stream restores the main framebuffer and leaves surfaces usable.
    draw([copy(1)]);
    expect(xy(1, 0), [255, 0, 0, 255]);
    const fresh = new GpuRenderSurface(1, 1);
    fails(() => target.draw({sprites: [sprite()]}, () => fresh), 'not prepared');
    fails(
      () =>
        target.prepareRenderSurface(
          new GpuRenderSurface(gl.getParameter(gl.MAX_TEXTURE_SIZE) + 1, 1),
        ),
      'texture limit',
    );
    exact([calls.reads, calls.uploads, calls.frames], [0, 2, 2]);
    target.invalidate(a);
    target.invalidate(a);
    exact([calls.deleteFrames, calls.deleteTextures], [1, 1]);
    fails(() => draw([bind(a)]), 'not prepared');
    target.prepareRenderSurface(a);
    draw([copy(0)]);
    expect(xy(1, 0), [0, 0, 0, 255]);
    draw([bind(a, [0, 0, 0, 0]), solid(0xff0000, 0, 128), bind(null), copy(0)]);
    expect(xy(1, 0), [64, 0, 0, 255]);
    exact(calls.reads, 0);
    const before = {...calls};
    target.dispose();
    exact(calls.deleteFrames - before.deleteFrames, 3); // Two surfaces plus presentation framebuffer.
    exact(calls.deleteTextures - before.deleteTextures, 4); // Two surfaces, white and presentation.
    const after = {...calls};
    target.dispose();
    exact(calls, after);
    // Switching between CPU-owned legacy targets and GPU targets only publishes the former.
    const legacyCanvas = document.createElement('canvas'),
      legacy = new CanvasDrawTarget(legacyCanvas, 2, 2),
      gpu = new GpuRenderSurface(2, 2);
    legacy.prepareRenderSurface(gpu);
    const legacyGl = legacy.gl,
      readPixels = legacyGl.readPixels.bind(legacyGl);
    let legacyReads = 0,
      published = [];
    legacyGl.readPixels = (...args) => {
      legacyReads++;
      return readPixels(...args);
    };
    const cpu = {width: 2, height: 2, pixels: new Uint8Array(16)},
      images = new Map([
        [0, gpu],
        [1, cpu],
      ]);
    legacy.draw(
      {
        sprites: [],
        commands: [
          bind(gpu),
          {kind: 'target', texture: 1, width: 2, height: 2},
          solid(0x00ff00, 0),
          bind(gpu),
          {kind: 'target', texture: null, width: 2, height: 2},
          copy(1, {destination: {x: 0, y: 0, width: 2, height: 2}}),
        ],
      },
      (id) => images.get(id),
      (id, image) => {
        published.push(id);
        images.set(id, image);
      },
    );
    exact([legacyReads, published], [1, [1]]);
    expect([...legacyCanvas.getContext('2d').getImageData(0, 0, 1, 1).data], [0, 255, 0, 255]);
    expect([...legacyCanvas.getContext('2d').getImageData(0, 1, 1, 1).data], [0, 0, 0, 255]);
    // Explicit capture remains available; it is the caller's CPU readback request.
    legacy.draw(
      {
        sprites: [],
        commands: [
          bind(gpu, [1, 0, 0, 1]),
          {kind: 'capture', texture: 2, width: 2, height: 2},
          bind(null),
        ],
      },
      (id) => images.get(id),
      (id, image) => {
        published.push(id);
        images.set(id, image);
      },
    );
    exact(legacyReads, 2);
    expect([...images.get(2).pixels.slice(0, 4)], [255, 0, 0, 255]);
    fails(() => target.draw({sprites: [sprite()]}, () => gpu), 'not prepared');
    target.dispose();
    legacy.dispose();
    const copyTarget = new CanvasDrawTarget(document.createElement('canvas'), 2, 2),
      smallCopy = new GpuRenderSurface(1, 1),
      bigCopy = new GpuRenderSurface(2, 2);
    copyTarget.prepareRenderSurface(smallCopy);
    copyTarget.prepareRenderSurface(bigCopy);
    fails(
      () =>
        copyTarget.draw(
          {sprites: [], commands: [{kind: 'gpu-copy', source: bigCopy, destination: smallCopy}]},
          () => null,
        ),
      'dimensions differ',
    );
    fails(() => copyTarget.draw({sprites: [], commands: [snapshot]}, () => null), 'not prepared');
    copyTarget.dispose();
    status.textContent = `PASS: ${checks} Canvas checks (RGBA, crop, GPU nesting, masks, extra textures, retention, release, legacy targets and explicit captures).`;
  } catch (error) {
    status.textContent = `FAIL: ${error.stack}`;
    throw error;
  }
</script>
