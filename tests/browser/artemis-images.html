<!doctype html>
<meta charset="utf-8" />
<title>Artemis synthetic image pipeline</title>
<canvas id="frame" style="width: 256px; height: 128px; image-rendering: pixelated"></canvas>
<pre id="result">Running synthetic PNG / Lua / raster checks</pre>
<script type="module">
  import {ArtemisDrawShaderResource} from '../../dist/engines/artemis/draw-shader.js';
  import {ArtemisShaderLibrary} from '../../dist/engines/artemis/shader-library.js';
  import {ArtemisShaderConstantStorage} from '../../dist/engines/artemis/shader-properties.js';
  import {createArtemisDrawShaderPreset} from '../../dist/engines/artemis/draw-shader.js';
  import {
    artemisDx9ShaderSources,
    artemisDx9ShaderShade,
  } from '../../dist/engines/artemis/dx9-shader.js';
  import {
    ARTEMIS_2898_EXECUTABLE_SHA256,
    ARTEMIS_2908_EXECUTABLE_SHA256,
  } from '../../dist/engines/artemis/revision.js';
  import {artemisRadialShade} from '../../dist/engines/artemis/radial-shader.js';
  import {ArtemisBrowserRasterShader} from '../../dist/engines/artemis/browser-raster-shader.js';
  import {createArtemisRollingVoice} from '../../dist/engines/artemis/browser-rolling-voice.js';
  import {createArtemisBufferedSoundDecoder} from '../../dist/engines/artemis/buffered-sound-decoder.js';
  import {ArtemisWaveSource} from '../../dist/engines/artemis/wave-source.js';
  import {encodeWav} from '../../dist/audio/pcm.js';
  import {ArtemisSoundLoader} from '../../dist/engines/artemis/sound-loader.js';
  import {createArtemisBrowserEffectVoices} from '../../dist/engines/artemis/browser-effect-voices.js';
  import {ArtemisTextInsertion} from '../../dist/engines/artemis/text-insertion.js';
  import {ArtemisTextGlyphs} from '../../dist/engines/artemis/text-glyphs.js';
  import {ArtemisFileFonts} from '../../dist/engines/artemis/file-fonts.js';
  import {ArtemisGlyphPainter} from '../../dist/engines/artemis/glyph-paint-client.js';
  import {FreeTypeWorker} from '../../dist/text/freetype-worker-client.js';
  import {buildAtlasFont} from '../../dist/text/atlas-font.js';
  import {ArtemisImageGraphics} from '../../dist/engines/artemis/image-graphics.js';
  import {ArtemisLayers} from '../../dist/engines/artemis/layers.js';
  import {
    createArtemisImageLoader,
    createArtemisBrowserImageLoader,
  } from '../../dist/engines/artemis/image-loader.js';
  import {ArtemisSurfaceCache} from '../../dist/engines/artemis/surface-cache.js';
  import {createArtemisOrdinaryGpuRaster} from '../../dist/engines/artemis/gpu-raster.js';
  import {ARTEMIS_3179_EXECUTABLE_SHA256 as revision} from '../../dist/engines/artemis/revision.js';
  import {ArtemisLua} from '../../dist/engines/artemis/lua.js';
  import {ArtemisScript} from '../../dist/engines/artemis/script.js';
  import {ArtemisStage} from '../../dist/engines/artemis/stage.js';
  import {ArtemisTransition} from '../../dist/engines/artemis/transition.js';
  import {artemisCursorLayer} from '../../dist/engines/artemis/browser/layers.js';
  import {ArtemisLayerCommands} from '../../dist/engines/artemis/layer-commands.js';
  import {GpuRenderSurface} from '../../dist/graphics/gpu-render-surface.js';
  import {CanvasDrawTarget} from '../../dist/graphics/draw-list.js';

  /** Synthetic single rectangle glyph. Remap the cmap from COLR's empty base to its
   * outline layer, so historical FreeType tests ordinary glyf data without COLR.
   */
  function rectangleFont() {
    const bytes = new Uint8Array(
      buildAtlasFont([
        {
          codePoint: 65,
          width: 0.25,
          height: 0.5,
          advance: 0.75,
          pixels: Uint8Array.of(255, 255, 255, 255),
          pixelWidth: 1,
          pixelHeight: 1,
          sourceX: 0,
          sourceY: 0,
          sourceWidth: 1,
          sourceHeight: 1,
        },
      ]),
    );
    const view = new DataView(bytes.buffer);
    const sum = (start, length) => {
      let value = 0;
      for (let i = 0; i < length; i += 4) value = (value + view.getUint32(start + i)) >>> 0;
      return value;
    };
    let head;
    for (let i = 0; i < view.getUint16(4); i++) {
      const at = 12 + i * 16,
        tag = new TextDecoder().decode(bytes.subarray(at, at + 4)),
        offset = view.getUint32(at + 8),
        length = view.getUint32(at + 12);
      if (tag === 'cmap') {
        view.setUint32(offset + 36, 2);
        view.setUint32(at + 4, sum(offset, (length + 3) & ~3));
      }
      if (tag === 'head') head = offset;
    }
    view.setUint32(head + 8, 0);
    view.setUint32(head + 8, (0xb1b0afba - sum(0, bytes.length)) >>> 0);
    return bytes;
  }

  const png = Uint8Array.from(
    atob(
      'iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAAD0lEQVR4nGP4zwAE/xkaAAt+An+rqPSSAAAAAElFTkSuQmCC',
    ),
    (c) => c.charCodeAt(0),
  );
  const assert = (value, message) => {
    if (!value) throw new Error(message);
  };
  const command = (name, args = {}) => ({
    kind: 'tag',
    name,
    sourceLine: -1,
    args: new Map(Object.entries(args)),
  });
  const effects = [];
  const tracked = new Set(),
    created = [],
    deleted = [];
  let uploads = 0,
    context;
  const prototype = WebGL2RenderingContext.prototype;
  const originalUpload = prototype.texImage2D,
    originalCreate = prototype.createTexture,
    originalDelete = prototype.deleteTexture;
  prototype.createTexture = function (...args) {
    const texture = originalCreate.apply(this, args);
    created.push(texture);
    return texture;
  };
  prototype.deleteTexture = function (texture) {
    deleted.push(texture);
    return originalDelete.call(this, texture);
  };
  prototype.texImage2D = function (...args) {
    context = this;
    if (args[3] === 2 && args[4] === 1 && args[8] instanceof Uint8Array && args[8].length === 8) {
      uploads++;
      tracked.add(this.getParameter(this.TEXTURE_BINDING_2D));
    }
    return originalUpload.apply(this, args);
  };
  let target, layers, lua, cache;
  try {
    const canvas = document.querySelector('#frame');
    const commandRegistry = new ArtemisLayerCommands(revision);
    target = new CanvasDrawTarget(canvas, 4, 2);
    const graphics = new ArtemisImageGraphics(
      revision,
      target,
      {
        creationMode: () => 0,
        clearLayerCommands: (ids) => {
          commandRegistry.clear(ids);
          effects.push(['clear', ...ids]);
        },
        resetLayerCommands: (id, tag) => {
          commandRegistry.reset(id, tag);
          effects.push(['reset', id]);
        },
        recordLayerProperties: (tag) => {
          commandRegistry.record(tag);
          effects.push(['record', tag.args.get('id')]);
        },
        imageLoadFailed: () => {
          throw new Error('synthetic image missing');
        },
        layerNotFound: () => {
          throw new Error('synthetic layer missing');
        },
      },
      {
        filter: 'nearest',
        blend: {
          color: {source: 'source-alpha', destination: 'inverse-source-alpha', operation: 'add'},
          alpha: {source: 'one', destination: 'inverse-source-alpha', operation: 'add'},
        },
      },
    );
    let surfacePrepares = 0;
    cache = new ArtemisSurfaceCache(
      revision,
      8n,
      createArtemisImageLoader(revision, async (path) => (path === 'synthetic.png' ? png : null)),
      {
        storageBytes: () => 8, // Explicit synthetic surface layout, not a native format guess.
        prepare: (resource) => {
          surfacePrepares++;
          target.prepareImage(resource.image);
        },
        dispose: (resource) => target.invalidate(resource.image),
      },
    );
    layers = new ArtemisLayers(revision, cache, graphics);
    const stageState = {transition: 0, dirty: false, refresh: 0};
    const stage = new ArtemisStage(revision, {
      captureMode: () => 0,
      transitionState: () => stageState.transition,
      clearTransitionRule: () => {
        ruleImage = null;
      },
      resetTransitionLayerValue: () => {},
      setTransitionState: (value) => {
        stageState.transition = value;
      },
      markSceneDirty: () => {
        stageState.dirty = true;
      },
      commitLayers: () => layers.commit(),
      refreshState: () => stageState.refresh,
      setRefreshState: (value) => {
        stageState.refresh = value;
      },
    });
    const source = new TextEncoder().encode(
      `[lua]function prepare(e) e:tag{'lyc',id='2',file='synthetic'}; completed=true end[/lua][calllua function="prepare"][flip][stop]`,
    );
    let script, pending;
    lua = new ArtemisLua({
      readFile: () => source,
      fileExists: () => true,
      now: () => 0,
      variable: () => '0',
      suspendableTags: true,
      tag: (tag) => script.executeTag(tag),
      enqueueTag: () => {},
    });
    script = new ArtemisScript(lua, {
      readFile: () => source,
      dispatch: (tag) => {
        if (tag.name === 'lyc') {
          pending = layers.dispatch(tag);
          return 'suspended';
        }
        if (stage.dispatch(tag)) return;
        if (tag.name === 'stop') return 'stopped';
        throw new Error('unexpected synthetic command');
      },
    });
    script.load('synthetic boot');
    assert(script.run() === 'waiting', 'Lua did not wait for PNG resource');
    await pending;
    assert(uploads === 1, 'image was not prepared exactly once');
    assert(
      graphics.drawCommitted(layers.scene).commands.length === 0,
      'uncommitted layer presented',
    );
    assert(
      [...tracked].every((texture) => !deleted.includes(texture)),
      'prepared image evicted by empty frame',
    );
    script.resumeLua();
    assert(script.run() === 'stopped', 'Lua did not resume through native flip');
    assert(lua.vm.getGlobal('completed') === true, 'Lua local continuation lost');
    assert(stageState.dirty === true, 'native flip did not mark scene dirty');
    graphics.drawCommitted(layers.scene);
    const pixels = [...canvas.getContext('2d').getImageData(0, 0, 4, 2).data];
    assert(pixels.slice(0, 4).join(',') === '0,0,0,255', 'transparent red changed the frame');
    assert(pixels.slice(4, 8).join(',') === '0,128,0,255', 'shared GPU alpha/color mismatch');
    assert(uploads === 1, 'committed image was uploaded again');
    // Pointer hit test: inverse matrix into the image bounds, then the clickable threshold
    // gates the pixel alpha (transparent red, half-opaque green).
    const hits = (x, y) => graphics.hitTest(layers.scene, x, y).join(',');
    assert(hits(0, 0) === '2' && hits(1.5, 0.5) === '2', 'threshold 0 hit test missed');
    assert(hits(2, 0) === '' && hits(-0.5, 0) === '' && hits(0, 1) === '', 'hit outside image');
    const hitDisplay = layers.scene.entry('2').value.display;
    hitDisplay.apply({clickablethreshold: 1});
    assert(hits(0, 0) === '' && hits(1, 0) === '2', 'alpha threshold hit test mismatch');
    hitDisplay.apply({clickablethreshold: 0});
    // Real command order: pending layer edits become visible through trans, whose
    // completion commits them. A flip before trans would hide the renderer regression.
    let crossfade = 0,
      vague = 0,
      threshold = 0,
      ruleImage = null,
      ruleRevision = 0;
    let transitionTween,
      transitionMode = 0;
    const grayRule = {
      width: 4,
      height: 2,
      bytesPerPixel: 1,
      format: 0,
      pixels: new Uint8Array(8).fill(128),
    };
    const transition = new ArtemisTransition(revision, {
      captureMode: () => 0,
      commit: () => stage.commit(),
      enterRunMode: (mode) => {
        transitionMode = mode;
      },
      releaseRunMode: () => {
        transitionMode = 0;
      },
      now: () => 100,
      setWaitStart: () => {
        throw new Error('unexpected type 0 wait');
      },
      skipState: () => ({allowed: true, command: false, control: false}),
      setTransitionState: (state) => {
        stageState.transition = state;
      },
      setCrossfade: (value) => {
        crossfade = value;
      },
      stageSize: () => ({width: 4, height: 2}),
      loadRule: async () => grayRule,
      setRuleImage: (image) => {
        ruleImage = image;
        ruleRevision++;
      },
      ruleImage: () => grayRule,
      setVague: (value) => {
        vague = value;
      },
      setRuleThreshold: (value) => {
        threshold = value;
      },
      registerTween: (tween) => {
        transitionTween = tween;
      },
      reportError: () => {
        throw new Error('synthetic transition error');
      },
    });
    const presentation = () => ({
      state: stageState.transition,
      crossfade,
      vague,
      threshold,
      rule: ruleImage,
      ruleRevision,
    });
    const stagePixel = () => [...canvas.getContext('2d').getImageData(1, 0, 1, 1).data].join(',');
    graphics.drawStage(layers.scene, presentation());
    assert(stagePixel() === '0,128,0,255', 'stage frame differs from the committed frame');
    await layers.dispatch(command('lyprop', {id: '2', visible: '0'}));
    transition.dispatch(command('trans', {type: '1', time: '4', input: '0'}));
    transitionTween.tick(100);
    graphics.drawStage(layers.scene, presentation());
    assert(stagePixel() === '0,128,0,255', 'crossfade did not start from the presented frame');
    transitionTween.tick(102);
    graphics.drawStage(layers.scene, presentation());
    const half = stagePixel().split(',').map(Number);
    assert(Math.abs(half[1] - 64) <= 1 && half[3] === 255, 'crossfade midpoint mismatch');
    graphics.drawCommitted(layers.scene);
    assert(stagePixel() === '0,128,0,255', 'transition committed pending edits before completion');
    transitionTween.tick(104);
    graphics.drawStage(layers.scene, presentation());
    assert(stagePixel() === '0,0,0,255', 'crossfade did not end at the new frame');
    assert(transitionMode === 0, 'completed crossfade did not release the run mode');

    await layers.dispatch(command('lyprop', {id: '2', visible: '1'}));
    await transition.dispatch(command('trans', {type: '2', time: '4', vague: '128', rule: 'gray'}));
    transitionTween.tick(200);
    graphics.drawStage(layers.scene, presentation());
    assert(stagePixel() === '0,0,0,255', 'rule transition did not start from the previous frame');
    transitionTween.tick(202);
    graphics.drawStage(layers.scene, presentation());
    const ruleHalf = stagePixel().split(',').map(Number);
    assert(
      Math.abs(ruleHalf[1] - 64) <= 1 && ruleHalf[3] === 255,
      'rule transition midpoint mismatch',
    );
    transitionTween.tick(204);
    graphics.drawStage(layers.scene, presentation());
    assert(stagePixel() === '0,128,0,255', 'rule transition did not commit its new scene');
    assert(
      transitionMode === 0 && ruleImage === null,
      'rule transition did not release its owners',
    );
    await layers.dispatch(command('lyprop', {id: '2', visible: '0'}));
    stage.dispatch(command('flip'));
    graphics.drawCommitted(layers.scene);
    assert(
      [...tracked].every((texture) => !deleted.includes(texture)),
      'hidden actor texture evicted',
    );
    // The cursor stays live above both transitions; neither saved stage image may
    // contain it. Use a configured name unrelated to the real game's name.
    lua.vm.execute(new TextEncoder().encode('csv={mw={cursor={id="pointer"}}}'));
    const cursorID = artemisCursorLayer(lua.vm);
    assert(cursorID === 'pointer', 'configured cursor layer was not resolved');
    await layers.dispatch(
      command('lyc', {id: cursorID, width: '1', height: '1', color: 'ffff0000'}),
    );
    await layers.dispatch(command('lyprop', {id: cursorID, left: '0', top: '1'}));
    stage.dispatch(command('flip'));
    const pixel = (x, y) => [...canvas.getContext('2d').getImageData(x, y, 1, 1).data];
    for (const type of ['1', '2']) {
      await layers.dispatch(command('lyprop', {id: cursorID, left: '0', visible: '1'}));
      await layers.dispatch(command('lyprop', {id: '2', visible: '1'}));
      stage.dispatch(command('flip'));
      graphics.drawStage(layers.scene, presentation(), cursorID);
      assert(pixel(0, 1).join() === '255,0,0,255', 'live cursor missing before transition');
      await layers.dispatch(command('lyprop', {id: '2', visible: '0'}));
      await transition.dispatch(command('trans', {type, time: '4', vague: '128', rule: 'gray'}));
      transitionTween.tick(300);
      await layers.dispatch(command('lyprop', {id: cursorID, left: '3'}));
      transitionTween.tick(302);
      graphics.drawStage(layers.scene, presentation(), cursorID);
      assert(
        pixel(0, 1).join() === '0,0,0,255',
        'old cursor position survived in transition frame',
      );
      assert(pixel(3, 1).join() === '255,0,0,255', 'current cursor faded with the scene');
      await layers.dispatch(command('lyprop', {id: cursorID, visible: '0'}));
      graphics.drawStage(layers.scene, presentation(), cursorID);
      assert(pixel(3, 1).join() === '0,0,0,255', 'hidden cursor survived until scene commit');
      transitionTween.tick(304);
      graphics.drawStage(layers.scene, presentation(), cursorID);
    }
    await layers.dispatch(command('lydel', {id: cursorID}));
    stage.dispatch(command('flip'));
    lua.vm.execute(new TextEncoder().encode('csv.mw.cursor=nil'));
    assert(artemisCursorLayer(lua.vm) === null, 'missing cursor config did not clear the overlay');
    // A nested or missing configured ID never stops the frame; layers draw in place.
    await layers.dispatch(
      command('lyc', {id: 'moving', width: '1', height: '1', color: 'ffff0000'}),
    );
    await layers.dispatch(command('lyprop', {id: 'moving', left: '0', top: '1'}));
    stage.dispatch(command('flip'));
    for (const id of ['moving.inner', 'absent', '']) {
      try {
        graphics.drawStage(layers.scene, presentation(), id);
      } catch (error) {
        throw Error(`live ID "${id}" stopped the frame: ${error.message}`);
      }
      assert(pixel(0, 1).join() === '255,0,0,255', `layer vanished with live ID "${id}"`);
    }
    await layers.dispatch(command('lydel', {id: 'moving'}));
    stage.dispatch(command('flip'));
    const afterCursor = {created: created.length, deleted: deleted.length};
    let refused = false;
    try {
      target.prepareImage({
        width: context.getParameter(context.MAX_TEXTURE_SIZE) + 1,
        height: 0,
        pixels: new Uint8Array(),
      });
    } catch (error) {
      refused = error.message.includes('Texture upload failed');
    }
    assert(
      commandRegistry
        .commands('2')
        .map((tag) => `${tag.name}:${tag.args.get('visible') ?? ''}`)
        .join() === 'lyc:,lyprop:0',
      'property command registry was not updated',
    );
    assert(refused, 'oversized texture was accepted');
    assert(
      created.length - deleted.length === afterCursor.created - afterCursor.deleted,
      'failed upload leaked its texture',
    );
    await layers.dispatch(command('lydel', {id: '2'}));
    stage.dispatch(command('flip'));
    graphics.drawCommitted(layers.scene);
    assert(
      [...tracked].every((texture) => !deleted.includes(texture)),
      'idle cached surface lost its GPU binding',
    );
    assert(cache.bytesUsed === 8n, 'idle surface accounting lost');
    await layers.dispatch(command('lyc', {id: '3', file: 'synthetic'}));
    stage.dispatch(command('flip'));
    graphics.drawCommitted(layers.scene);
    assert(uploads === 1 && surfacePrepares === 1, 'idle promotion decoded or uploaded again');
    assert(
      [...canvas.getContext('2d').getImageData(1, 0, 1, 1).data].join(',') === '0,128,0,255',
      'promoted cached surface did not render',
    );
    cache.close(); // Active layer must survive shutdown until its own release.
    assert(
      [...tracked].every((texture) => !deleted.includes(texture)),
      'active loan invalidated on close',
    );
    graphics.drawCommitted(layers.scene);
    await layers.dispatch(command('lydel', {id: '3'}));
    stage.dispatch(command('flip'));
    assert(
      [...tracked].every((texture) => deleted.filter((item) => item === texture).length === 1),
      'last actor did not release its texture once',
    );
    assert(cache.bytesUsed === 0n, 'closed cache retained released loan');
    assert(commandRegistry.commands('2') === undefined, 'deleted layer commands retained');
    assert(context.getError() === context.NO_ERROR, 'remaining WebGL error');
    // The remaining solid fallback checks use a fresh ordinary loader after cache shutdown.
    layers.close();
    layers = new ArtemisLayers(
      revision,
      createArtemisImageLoader(revision, async () => null),
      graphics,
    );
    await layers.dispatch(
      command('lyc', {id: '-1', file: 'missing', width: '4', height: '2', color: 'ff0000'}),
    );
    await layers.dispatch(
      command('lyc', {id: '0', file: 'missing', width: '4', height: '2', color: '00ff00'}),
    );
    stage.dispatch(command('flip'));
    graphics.drawCommitted(layers.scene);
    const drawOrderPixel = [...canvas.getContext('2d').getImageData(0, 0, 1, 1).data];
    assert(
      drawOrderPixel.join(',') === '0,255,0,255',
      'native ascending GPU preparation order mismatch',
    );
    // takess renders the committed scene offscreen; savess reads it back top row first.
    assert(graphics.readScreenshot(4, 2) === null, 'screenshot existed before takess');
    await layers.dispatch(
      command('lyc', {id: '1', file: 'missing', width: '4', height: '1', color: '0000ff'}),
    );
    await layers.dispatch(command('lyprop', {id: '1', top: '1'}));
    stage.dispatch(command('flip'));
    graphics.takeScreenshot(layers.scene);
    assert(
      [...canvas.getContext('2d').getImageData(0, 1, 1, 1).data].join(',') === '0,255,0,255',
      'takess changed the presented frame',
    );
    const shot = graphics.readScreenshot(4, 2);
    assert(
      [...shot.subarray(0, 4)].join(',') === '0,255,0,255' &&
        [...shot.subarray(16, 20)].join(',') === '0,0,255,255',
      'screenshot rows are not top first',
    );
    assert(graphics.readScreenshot(2, 1).length === 8, 'scaled screenshot size mismatch');
    layers.close();
    // Format-2 intermediate shaders replace straight RGBA using a GPU background snapshot.
    let nativeCapturedCases = 0;
    const captureTarget = new CanvasDrawTarget(document.createElement('canvas'), 2, 2);
    try {
      const capture = new GpuRenderSurface(2, 2),
        background = new GpuRenderSurface(2, 2),
        foreground = {width: 1, height: 1, pixels: new Uint8Array([128, 64, 192, 128])},
        images = [foreground, capture, background],
        raster = createArtemisOrdinaryGpuRaster(revision),
        coords = [
          [0, 0],
          [1, 0],
          [0, 1],
          [1, 1],
        ],
        replace = {
          color: {source: 'one', destination: 'zero', operation: 'add'},
          alpha: {source: 'one', destination: 'zero', operation: 'add'},
        };
      captureTarget.prepareRenderSurface(capture);
      captureTarget.prepareRenderSurface(background);
      captureTarget.prepareImage(foreground);
      for (const mode of ['normal', 'add', 'screen', 'multiply'])
        for (let bits = 0; bits < 8; bits++) {
          const state = {
              negative: !!(bits & 4),
              grayscale: !!(bits & 2),
              colorMultiply: bits & 1 ? 0x4080c0 : 0xffffff,
            },
            color = bits & 1 ? [64 / 255, 128 / 255, 192 / 255] : [1, 1, 1],
            shader = raster.captured(mode, state);
          captureTarget.draw(
            {
              sprites: [],
              clearColor: [0, 0, 0, 0],
              commands: [
                {
                  kind: 'gpu-target',
                  surface: capture,
                  clearColor: [51 / 255, 102 / 255, 153 / 255, 64 / 255],
                },
                {kind: 'gpu-copy', source: capture, destination: background},
                {
                  kind: 'triangles',
                  texture: 0,
                  topology: 'triangle-strip',
                  normalizedUV: true,
                  vertices: new Float32Array(
                    coords.flatMap(([x, y]) => [x * 2, y * 2, 0, ...color, 0.75, x, y]),
                  ),
                  blendState: shader.blend,
                  fragment: shader.fragment,
                  additionalTextures: [
                    {texture: 2, uv: new Float32Array(coords.flat()), filter: 'linear'},
                  ],
                },
                {kind: 'gpu-target', surface: null},
                {
                  texture: 1,
                  source: {x: 0, y: 0, width: 2, height: 2},
                  destination: {x: 0, y: 0, width: 2, height: 2},
                  color: 0xffffff,
                  alpha: 255,
                  blendState: replace,
                },
              ],
            },
            (id) => images[id],
          );
          const actual = new Uint8Array(4),
            gl = captureTarget.gl;

              param: 0.75,

              green: 0.8,
              blue: 0.6,
              step: 0.25,
              weights: [0.5, 0.25, 0, 0, 0, 0, 0, 0],
            };
            const constants = new Map(
              adapter.fields.map((field) => [
                field.name,
                field.name === 'weights'
                  ? p.weights
                  : [field.name === 'width' || field.name === 'height' ? p.step : p[field.name]],
              ]),
            );
            constants.set('alpha', [p.alpha]);
            const extras = [];
            if (captured) extras.push({texture: 1, uv, filter: 'linear'});
            if (bound) extras.push({texture: 2, uv, filter: 'linear'});
            drawTarget.draw(
              {
                sprites: [],
                commands: [
                  {
                    ...base,
                    fragment: adapter.fragment,
                    parameters: adapter.parameters(constants),
                    additionalTextures: extras,
                  },
                ],
              },
              (id) => (id === 1 ? dxFore : dxMask),
            );
            const actual = new Uint8Array(64);
            drawTarget.gl.readPixels(
              0,
              0,
              4,
              4,
              drawTarget.gl.RGBA,
              drawTarget.gl.UNSIGNED_BYTE,
              actual,
            );
            for (let i = 0; i < 16; i++) {
              const expected = artemisDx9ShaderShade(
                kind,
                () => [32 / 255, 128 / 255, 192 / 255, 160 / 255],
                0.5,
                0.5,
                {
                  ...p,
                  mask: bound ? () => [0, 0, 0, sampledMask[i * 4 + 3] / 255] : undefined,
                  back: () => [32 / 255, 128 / 255, 192 / 255, 160 / 255],
                },
              );
              for (let c = 0; c < 4; c++)
                assert(
                  Math.abs(
                    actual[i * 4 + c] - Math.round(Math.max(0, Math.min(1, expected[c])) * 255),
                  ) <= 2,
                  'DX9 GPU ' +
                    kind +
                    ':' +
                    captured +
                    ':' +
                    bound +
                    ':' +
                    i +
                    ':' +
                    c +
                    ':' +
                    actual[i * 4 + c] +
                    '/' +
                    Math.round(Math.max(0, Math.min(1, expected[c])) * 255),
                );
            }
            assert(drawTarget.gl.getError() === drawTarget.gl.NO_ERROR, 'DX9 GPU error');
            dx9GpuCases++;
          }
    } finally {
      drawTarget.dispose();
    }
    // Calibration compiler selects reconstructed programs; real-source SHA selection
    // is checked separately by the nonvisual installation probe, without game pixels.
    const actorCanvas = document.createElement('canvas'),
      actorTarget = new CanvasDrawTarget(actorCanvas, 4, 4);
    let selectedProgram = 'raster';
    const library = new ArtemisShaderLibrary(
      revision,
      async () => new Uint8Array([1]),
      {
        compile: async () => ({
          shader: new ArtemisDrawShaderResource(revision, selectedProgram, (fragment, count) =>
            actorTarget.prepareTriangleShader(fragment, count),
          ),
        }),
        dispose: (shader) => shader.dispose(),
      },
      () => {
        throw Error('calibration shader compile failure');
      },
    );
    const ctag = (name, args) => ({name, args: new Map(Object.entries(args))});
    await library.dispatch(ctag('lyshader', {id: 'warp', file: 'calibration'}));
    selectedProgram = 'screen';
    await library.dispatch(ctag('lyshader', {id: 'user', file: 'calibration'}));
    const released = [];
    const actorGraphics = new ArtemisImageGraphics(
      revision,
      actorTarget,
      {
        creationMode: () => 0,
        clearLayerCommands: () => {},
        resetLayerCommands: () => {},
        recordLayerProperties: () => {},
        imageLoadFailed: () => {
          throw Error('actor image missing');
        },
        layerNotFound: () => {
          throw Error('actor missing');
        },
      },
      createArtemisOrdinaryGpuRaster(revision),
      library,
    );
    const actorLayers = new ArtemisLayers(
      revision,
      {
        load: async (path) => {
          const image = path === 'fore' ? drawFore : path === 'user' ? drawUser : null;
          if (!image) return null;
          let live = true;
          return {
            path,
            image,
            surfaceFormat: 2,
            lease: {
              release: () => {
                assert(live, 'actor resource double release');
                live = false;
                released.push(path);
              },
            },
          };
        },
      },
      actorGraphics,
    );
    const actorPixels = () => {
      actorGraphics.drawCommitted(actorLayers.scene);
      const gl = actorTarget.gl,
        out = new Uint8Array(64);
      gl.readPixels(0, 0, 4, 4, gl.RGBA, gl.UNSIGNED_BYTE, out);
      return out;
    };
    const assertActor = (actual, expected, label) => {
      for (let y = 0; y < 4; y++)
        for (let x = 0; x < 4; x++)
          for (let ch = 0; ch < 4; ch++)
            assert(
              Math.abs(
                actual[(y * 4 + x) * 4 + ch] -
                  Math.round(
                    ((ch === 3 ? expected(x, y)[3] : expected(x, y)[ch]) * expected(x, y)[3]) / 255,
                  ),
              ) <= 1,
              label + ':' + x + ':' + y + ':' + ch,
            );
    };
    try {
      await actorLayers.dispatch(ctag('lyc', {id: '1', file: 'fore'}));
      await actorLayers.dispatch(
        ctag('lyprop', {
          id: '1',
          alpha: '127.5',
          shader: 'warp',
          shaderconstant: 'a,b',
          a: '90,0',
          b: '.25',
        }),
      );
      actorLayers.commit();
      assertActor(
        actorPixels(),
        (x, y) => [Math.max(0, x - 1) * 40, (3 - y) * 40, 0, 100],
        'actual scene raster',
      );
      await actorLayers.dispatch(
        ctag('lyprop', {id: '1', shaderconstant: 'notHlslNames', notHlslNames: '0,0,0'}),
      );
      assertActor(
        actorPixels(),
        (x, y) => [Math.max(0, x - 1) * 40, (3 - y) * 40, 0, 100],
        'retained shader frame',
      );
      actorLayers.commit();
      assertActor(
        actorPixels(),
        (x, y) => [x * 40, (3 - y) * 40, 0, 100],
        'committed shader constants',
      );
      await actorLayers.dispatch(
        ctag('lyprop', {
          id: '1',
          shader: 'user',
          shadertexture: 'renamed,missing',
          renamed: 'user',
          missing: 'absent',
        }),
      );
      actorLayers.commit();
      assertActor(
        actorPixels(),
        (x, y) => {
          const fore = [x * 40, (3 - y) * 40, 0],
            user = [128, 64, 192];
          return [
            ...fore.map((f, c) =>
              Math.round(255 * (1 - (1 - f / 255) * (1 - ((user[c] / 255) * 128) / 255))),
            ),
            100,
          ];
        },
        'ordered shader texture binding',
      );
      await actorLayers.dispatch(ctag('lyprop', {id: '1', shadertexture: ''}));
      actorLayers.commit();
      assertActor(actorPixels(), (x, y) => [x * 40, (3 - y) * 40, 0, 100], 'null D3D user texture');
      selectedProgram = 'reset';
      await library.dispatch(ctag('lyshader', {id: 'user', file: 'calibration'}));
      assertActor(
        actorPixels(),
        (x, y) => [x * 40, (3 - y) * 40, 0, 100],
        'named program replacement',
      );
      await actorLayers.dispatch(ctag('lyprop', {id: '1', shader: 'missing-program'}));
      actorLayers.commit();
      const missing = actorPixels();
      for (let i = 0; i < 64; i++)
        if (i % 4 !== 3) assert(missing[i] === 0, 'null pixel shader no color');
      await actorLayers.dispatch(ctag('lydel', {id: '1'}));
      actorLayers.commit();
      selectedProgram = 'screen';
      await library.dispatch(ctag('lyshader', {id: 'captured-user', file: 'calibration'}));
      await actorLayers.dispatch(ctag('lyc', {id: 'g.1', file: 'fore'}));
      await actorLayers.dispatch(
        ctag('lyprop', {
          id: 'g.1',
          alpha: '127.5',
          shader: 'captured-user',
          shadertexture: 'first',
          first: 'user',
        }),
      );
      await actorLayers.dispatch(ctag('lyprop', {id: 'g', intermediate_render: '1'}));
      actorLayers.commit();
      assertActor(
        actorPixels(),
        (x, y) => {
          const fore = [x * 40, (3 - y) * 40, 0],
            user = [128, 64, 192];
          return [
            ...fore.map((f, c) =>
              Math.round(255 * (1 - (1 - f / 255) * (1 - ((user[c] / 255) * 128) / 255))),
            ),
            100,
          ];
        },
        'captured custom shader and user slot',
      );
    } finally {
      actorLayers.close();
      library.close();
      actorTarget.dispose();
    }
    assert(
      released.filter((path) => path === 'fore').length === 2 &&
        released.filter((path) => path === 'user').length === 2,
      'actor texture resources released',
    );
    window.result = {
      passed: true,
      nativeFontWorker: true,
      nativeGlyphPainter: true,
      nativeTextGlyphBlocks: true,
      nativeTextInsertionFrame: true,
      nativeOfflineAudioVoices: true,
      nativeSoundFilenameVoiceIntegration: true,
      nativePairedWaveVoiceIntegration: true,
      nativeBufferedSoundDecoderIntegration: true,
      nativeRollingAudioWorklet: true,
      nativeCustomRasterShader: true,
      nativeAllCustomDrawShaders: true,
      nativeDx9DrawShaderCases: dx9GpuCases,
      nativeSceneCustomShaders: true,
      nativeCustomScreenShader: true,
      nativeStereoAttenuation: true,
      audioDeviceOutput: false,
      nativeFontVersion: [2, 4, 8],
      syntheticOnly: true,
      pixels,
      uploads,
      preparedRetention: true,
      failedUploadReleased: true,
      luaResumed: true,
      nativeFlip: stageState.dirty,
      nativeCommandRegistry: true,
      surfaceCacheIdleGpuRetention: true,
      surfaceCachePromotionNoDecodeOrUpload: true,
      surfaceCacheActiveCloseDeferred: true,
      nativeLinearAlphaFramebuffer: [...nativeFramebuffer],
      nativeTransparentClear: true,
      nativeModePixels,
      nativeEffectsCases,
      nativeCapturedCases,
      nativeIntermediateGroups: true,
      nativePsdWorker: true,
      nativeJpegWorker: true,
      nativeJpegExifIgnored: true,
      nativeClipPixels: [...nativeClipPixels],
      nativeOrdinaryGroups: true,
      nativeGroupPixel,
      serviceEffects: effects,
      drawOrderPixel,
    };
  } catch (error) {
    window.result = {passed: false, error: String(error), stack: error.stack};
  } finally {
    lua?.close();
    layers?.close();
    cache?.close();
    target?.dispose();
    prototype.texImage2D = originalUpload;
    prototype.createTexture = originalCreate;
    prototype.deleteTexture = originalDelete;
  }
  document.querySelector('#result').textContent = JSON.stringify(window.result);
  document.title = window.result.passed
    ? 'Artemis synthetic checks passed'
    : 'Artemis synthetic checks failed';
</script>
